apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-microservice-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-microservice-demo
  template:
    metadata:
      labels:
        app: ai-microservice-demo
    spec:
      containers:
        - name: api
          image: ghcr.io/OWNER/ai-microservice-demo:latest
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ai-microservice-secrets
                  key: database-url
