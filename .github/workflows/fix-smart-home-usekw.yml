name: Fix smart-home use_kW dataset

on:
  push:
    branches:
      - agent/fix-smart-home-usekw
    paths:
      - .github/workflows/fix-smart-home-usekw.yml

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Check out correction branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF dependency
        run: python -m pip install --disable-pip-version-check reportlab

      - name: Rebuild corrected Smart Home artifacts
        run: python datasets/smart-home-energy/preprocess_smart_home.py

      - name: Validate corrected CSV
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          path = Path('datasets/smart-home-energy/use_case_2_smart_home_energy.csv')
          with path.open(newline='', encoding='utf-8') as f:
              rows = list(csv.DictReader(f))

          assert len(rows) == 4200, len(rows)
          assert rows[0]['timestamp'] == '2016-01-01 05:00:00'
          assert rows[-1]['timestamp'] == '2016-01-04 02:59:00'
          values = [float(r['use_kW']) for r in rows]
          assert all(v == v for v in values)
          assert max(values) > 1.0, 'Target still looks like humidity rather than use [kW]'
          assert values[0] > 0.9, values[0]
          print('Validated rows:', len(rows))
          print('First use_kW:', values[0])
          print('Min/Max/Mean:', min(values), max(values), sum(values)/len(values))
          PY

      - name: Commit corrected artifacts and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-smart-home-usekw.yml
          git add \
            datasets/smart-home-energy/use_case_2_smart_home_energy.csv \
            datasets/smart-home-energy/README.md \
            datasets/smart-home-energy/use_case_2_smart_home_energy.pdf \
            datasets/smart-home-energy/preprocess_smart_home.py
          git diff --cached --stat
          git commit -m "Fix smart-home use_kW dataset"
          git push origin HEAD:agent/fix-smart-home-usekw
