name: ML2++ RAG Copilot CI

on:
  push:
    paths:
      - 'portfolio/ml2pp-rag-copilot/**'
      - '.github/workflows/ml2pp-rag-copilot-ci.yml'
  pull_request:
    paths:
      - 'portfolio/ml2pp-rag-copilot/**'
      - '.github/workflows/ml2pp-rag-copilot-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio/ml2pp-rag-copilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pytest -q
