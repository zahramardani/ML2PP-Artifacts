name: Validate corrected smart-home use_kW

on:
  push:
    branches:
      - agent/fix-smart-home-usekw
    paths:
      - .github/workflows/validate-smart-home-usekw.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check reportlab
      - name: Rebuild and validate
        run: |
          python datasets/smart-home-energy/preprocess_smart_home.py
          python - <<'PY'
          import csv
          from pathlib import Path
          path = Path('datasets/smart-home-energy/use_case_2_smart_home_energy.csv')
          with path.open(newline='', encoding='utf-8') as f:
              rows = list(csv.DictReader(f))
          values = [float(r['use_kW']) for r in rows]
          assert len(rows) == 4200
          assert rows[0]['timestamp'] == '2016-01-01 05:00:00'
          assert rows[-1]['timestamp'] == '2016-01-04 02:59:00'
          assert values[0] > 0.9
          assert max(values) > 1.0
          print('VALIDATED_ROWS=', len(rows))
          print('FIRST_USE_KW=', repr(values[0]))
          print('MIN_USE_KW=', repr(min(values)))
          print('MAX_USE_KW=', repr(max(values)))
          print('MEAN_USE_KW=', repr(sum(values)/len(values)))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: corrected-smart-home
          path: |
            datasets/smart-home-energy/use_case_2_smart_home_energy.csv
            datasets/smart-home-energy/README.md
            datasets/smart-home-energy/use_case_2_smart_home_energy.pdf
