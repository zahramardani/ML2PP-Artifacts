name: Corrected Smart-Home use_kW Rerun and Commit

on:
  push:
    branches: [smart-home-rerun-20260820]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  rerun:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: smart-home-rerun-20260820
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.3.5 pandas==2.2.3 statsmodels==0.14.6 matplotlib==3.10.8
      - name: Run corrected models
        run: python scripts/rerun_corrected_smart_home.py
      - name: Record workflow run
        run: |
          echo "${GITHUB_RUN_ID}" > SmartHome_Corrected_usekW_Reruns_2026-08-20/GITHUB_RUN_ID.txt
          echo "${GITHUB_SHA}" > SmartHome_Corrected_usekW_Reruns_2026-08-20/GITHUB_TRIGGER_SHA.txt
      - name: Build one ZIP
        run: zip -r SmartHome_ARIMA_HoltWinters_Corrected_usekW_2026-08-20.zip SmartHome_Corrected_usekW_Reruns_2026-08-20
      - name: Upload one evidence package
        uses: actions/upload-artifact@v4
        with:
          name: SmartHome-ARIMA-HoltWinters-Corrected-usekW-2026-08-20
          path: SmartHome_ARIMA_HoltWinters_Corrected_usekW_2026-08-20.zip
          if-no-files-found: error
          retention-days: 30
      - name: Commit results to rerun branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SmartHome_Corrected_usekW_Reruns_2026-08-20 SmartHome_ARIMA_HoltWinters_Corrected_usekW_2026-08-20.zip
          git commit -m "Add corrected use_kW ARIMA and Holt-Winters rerun evidence"
          git push origin HEAD:smart-home-rerun-20260820
